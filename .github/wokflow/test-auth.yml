name: Test YouTube Auth

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Google API
        run: |
          pip3 install google-auth google-auth-oauthlib google-api-python-client

      - name: Test YouTube Auth
        run: |
          python3 << 'EOF'
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          
          creds = Credentials(
              token=None,
              refresh_token="${{ secrets.YOUTUBE_REFRESH_TOKEN }}",
              client_id="${{ secrets.YOUTUBE_CLIENT_ID }}",
              client_secret="${{ secrets.YOUTUBE_CLIENT_SECRET }}",
              token_uri="https://oauth2.googleapis.com/token"
          )
          
          creds.refresh(Request())
          
          youtube = build("youtube", "v3", credentials=creds)
          request = youtube.channels().list(part="snippet", mine=True)
          response = request.execute()
          
          print("✅ Success!")
          print(f"Channel: {response['items'][0]['snippet']['title']}")
          EOF

name: YouTube Bot

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Video search keyword'
        required: true
        default: 'nature'
      sound:
        description: 'Sound search keyword'
        required: true
        default: 'piano'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Pixabay API
        env:
          PIX_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          echo "=== PIXABAY RESULTS ==="
          curl -s "https://pixabay.com/api/videos/?key=$PIX_KEY&q=${{ github.event.inputs.keyword }}"

      - name: Test Freesound API
        env:
          FS_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          echo "=== FREESOUND RESULTS ==="
          curl -s "https://freesound.org/apiv2/search/text/?query=${{ github.event.inputs.sound }}&token=$FS_KEY&fields=id,name,username"
